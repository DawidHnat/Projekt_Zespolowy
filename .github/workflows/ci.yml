name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: CI snapshot
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.snapshot.outputs.head }}
      base: ${{ steps.snapshot.outputs.base }}
    steps:
      - name: Record commits that CI will test
        id: snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const repo = await github.rest.repos.get(context.repo);
            const branch = await github.rest.repos.getBranch({...context.repo, branch: repo.data.default_branch});
            const head = context.payload.pull_request?.head.sha || context.sha;
            const base = branch.data.commit.sha;
            core.setOutput('head', head);
            core.setOutput('base', base);
            fs.writeFileSync('ci-snapshot.json', JSON.stringify({
              version: 1, head_sha: head, base_sha: base,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              run_id: Number(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || '1'),
              event: context.eventName
            }));
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-snapshot
          path: ci-snapshot.json
          retention-days: 7

  backend:
    name: Backend
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test against the recorded base
        env:
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
        run: |
          git config user.name 'Fleet-Flow CI'
          git config user.email 'ci@fleet-flow.invalid'
          git merge --no-commit --no-ff "$BASE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install pinned dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Lint, format and test
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Verify exported OpenAPI contract
        working-directory: backend
        run: uv run python scripts/export_openapi.py --check

  database:
    name: PostgreSQL migrations
    needs: snapshot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleetflow
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleetflow:fleetflow@localhost:5432/fleetflow
      DATA_SOURCE: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test against the recorded base
        env:
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
        run: |
          git config user.name 'Fleet-Flow CI'
          git config user.email 'ci@fleet-flow.invalid'
          git merge --no-commit --no-ff "$BASE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: backend
      - name: Migrate, seed and compare schema with models
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.db.seed
          uv run python -m app.db.seed
          uv run alembic check

  frontend:
    name: Frontend
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test against the recorded base
        env:
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
        run: |
          git config user.name 'Fleet-Flow CI'
          git config user.email 'ci@fleet-flow.invalid'
          git merge --no-commit --no-ff "$BASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint, types, tests and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test
          npm run build
      - name: Verify generated API types
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- src/shared/api/generated.ts

  workflow-tests:
    name: Automation policy
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test against the recorded base
        env:
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
        run: |
          git config user.name 'Fleet-Flow CI'
          git config user.email 'ci@fleet-flow.invalid'
          git merge --no-commit --no-ff "$BASE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/github/tests -v
