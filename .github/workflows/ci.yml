name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      FLEET_FLOW_BUILD_SHA: ${{ github.sha }}
      FLEET_FLOW_PUBLIC_URL: ${{ vars.DEV_PUBLIC_URL || 'https://fleet-flow.pl' }}
      VITE_MAPBOX_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify visible release revision
        run: |
          revision="${FLEET_FLOW_BUILD_SHA:0:7}"
          grep -F "data-build-sha=\"$revision\"" dist/index.html
          grep -F "data-build-sha=\"$revision\"" dist/status.html
      - name: Package application without local data or credentials
        working-directory: .
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' \
            --exclude='.env.*' --exclude='.venv' --exclude='.pytest_cache' \
            --exclude='.ruff_cache' --exclude='*.dump' --exclude='*.log' \
            -czf release.tgz frontend/dist backend infra/deploy
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          retention-days: 7

  backend:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_flow_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d fleet_flow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:synthetic-ci-password@127.0.0.1:5432/fleet_flow_test
      SYNC_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  container:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f infra/deploy/backend.Dockerfile -t fleet-flow-api:ci .
      - name: Verify non-root backend can load application code
        run: docker run --rm --entrypoint python fleet-flow-api:ci -c 'import app.main'

  e2e:
    name: Critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_flow_test_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: synthetic-e2e-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d fleet_flow_test_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://e2e:synthetic-e2e-only@127.0.0.1:5432/fleet_flow_test_e2e
      SYNC_ENABLED: 'false'
      VITE_MAPBOX_TOKEN: ''
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-results-${{ github.sha }}
          path: frontend/test-results/
          retention-days: 7

  required:
    name: Required CI
    if: always()
    needs: [frontend, backend, container, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every build and test job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$E2E_RESULT" = success

  deploy:
    name: Deploy development server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    concurrency:
      group: fleet-flow-development-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEV_HOST || '57.129.179.53' }}
      DEPLOY_USER: fleetdeploy
      DEPLOY_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
      RUNTIME_ENV: ${{ secrets.DEV_RUNTIME_ENV }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-${{ github.sha }}
      - name: Deploy checked artifact over verified SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$RUNTIME_ENV" || {
            echo '::error::Configure DEV_SSH_PRIVATE_KEY, DEV_SSH_KNOWN_HOSTS and DEV_RUNTIME_ENV.'
            exit 1
          }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          umask 077
          staging=$(mktemp -d "$RUNNER_TEMP/fleet-flow.XXXXXX")
          trap 'rm -rf -- "$staging"' EXIT
          mkdir "$staging/release"
          tar -xzf release.tgz -C "$staging/release"
          printf '%s\n' "$DEPLOY_KEY" > "$staging/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$staging/known_hosts"
          printf '%s\n' "$RUNTIME_ENV" > "$staging/release/runtime.env"
          tar -czf "$staging/upload.tgz" -C "$staging/release" .
          ssh -T -F /dev/null -i "$staging/key" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$staging/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$staging/upload.tgz"
          curl --fail --silent --show-error --max-time 20 "http://$DEPLOY_HOST/" \
            | grep -F "data-build-sha=\"${GITHUB_SHA:0:7}\""
