name: Backend integrations

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-integrations.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-integrations.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_flow_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d fleet_flow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:synthetic-ci-password@127.0.0.1:5432/fleet_flow_test
      SYNC_ENABLED: 'false'
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
