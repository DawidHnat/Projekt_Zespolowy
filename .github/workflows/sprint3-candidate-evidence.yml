name: Sprint 3 synthetic candidate QA evidence
on:
  push:
    branches: [test/sprint3-qa-candidate-evidence-20261126]
permissions:
  contents: read
jobs:
  candidate:
    name: Candidate QA (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [backend, desktop, mobile]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_flow_test_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: synthetic-e2e-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d fleet_flow_test_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://e2e:synthetic-e2e-only@127.0.0.1:5432/fleet_flow_test_e2e
      E2E_DATABASE_URL: postgresql+psycopg://e2e:synthetic-e2e-only@127.0.0.1:5432/fleet_flow_test_e2e
      SYNC_ENABLED: 'false'
      VITE_MAPBOX_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e499385ae25abb54b1f4c01abc71303a6c116e62
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: History, drivers, mileage, analytics, alerts and auth backend
        if: matrix.scope == 'backend'
        working-directory: backend
        run: python -m pytest -v tests/test_trip_importer.py tests/test_trip_annotations.py tests/test_mileage_period.py tests/test_usage_period.py tests/test_manual_drivers.py tests/test_manual_drivers_postgres.py tests/test_distance_alerts.py tests/test_auth.py tests/test_account_preferences.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.scope != 'backend'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: matrix.scope != 'backend'
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        if: matrix.scope != 'backend'
        working-directory: frontend
      - name: Independent candidate browser regression
        if: matrix.scope != 'backend'
        working-directory: frontend
        env:
          PROFILE: ${{ matrix.scope }}
        run: npm run test:e2e -- e2e/drivers.spec.ts e2e/history.spec.ts e2e/usage.spec.ts e2e/alerts.spec.ts e2e/critical-flow.spec.ts e2e/session-boundaries.spec.ts --project="$PROFILE"
      - name: Log evidence counts without sensitive test artifacts
        if: matrix.scope != 'backend' && always()
        working-directory: frontend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("test-results/results.xml")
          if not path.is_file():
              raise SystemExit("No JUnit report")
          cases = ET.parse(path).findall(".//testcase")
          bad = sum(any(c.find(t) is not None for t in ("failure", "error", "skipped")) for c in cases)
          print(f"Candidate browser evidence: {len(cases)-bad} PASS / {len(cases)} cases")
          if not cases or bad:
              raise SystemExit("Missing or unsuccessful candidate browser cases")
          PY
