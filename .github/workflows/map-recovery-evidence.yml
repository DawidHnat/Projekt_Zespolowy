name: Synthetic map recovery repetitions
on:
  push:
    branches: [test/map-recovery-evidence-20261126]
permissions:
  contents: read
jobs:
  recovery:
    name: Map recovery (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_flow_test_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: synthetic-e2e-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d fleet_flow_test_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://e2e:synthetic-e2e-only@127.0.0.1:5432/fleet_flow_test_e2e
      SYNC_ENABLED: 'false'
      E2E_SYNTHETIC_MAP: 'true'
      VITE_MAPBOX_TOKEN: pk.fleetflowsynthetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e5c51d90cb4d98d2d63d8bfa634897c16f2e1d0
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build synthetic map and run both recovery scenarios twice
        run: npm run test:e2e -- e2e/map-provider-recovery.spec.ts --project="$PROFILE" --repeat-each=2
        env:
          PROFILE: ${{ matrix.profile }}
        working-directory: frontend
      - name: Require four executed cases per profile
        working-directory: frontend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("test-results/results.xml").findall(".//testcase")
          bad = [c for c in cases if any(c.find(t) is not None for t in ("failure", "error", "skipped"))]
          print(f"Repeated map recovery: {len(cases)-len(bad)} PASS / {len(cases)} cases")
          if len(cases) != 4 or bad:
              raise SystemExit("Expected all four executions without skip")
          PY
