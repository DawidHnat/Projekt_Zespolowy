name: PR automation

# workflow_run executes the workflow from the default branch. It never runs
# scripts or dependencies from the feature branch with the model credential.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: pr-automation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read automation only from the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/github
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Open PR, review and merge an eligible small change
        env:
          GH_TOKEN: ${{ github.token }}
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: python scripts/github/automation.py
