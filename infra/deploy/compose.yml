services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: fleet-flow-api:${FLEET_FLOW_BUILD_SHA:?Set FLEET_FLOW_BUILD_SHA}
    build:
      context: ../..
      dockerfile: infra/deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ${FLEET_FLOW_ENV_FILE:?Set FLEET_FLOW_ENV_FILE}
    environment:
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      SYNC_ENABLED: 'false'
      FORWARDED_ALLOW_IPS: ${FLEET_FLOW_PROXY_IP:-172.30.96.3}
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases: [api-proxy]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/ready", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ['80:80', '443:443']
    networks:
      default:
      proxy:
        ipv4_address: ${FLEET_FLOW_PROXY_IP:-172.30.96.3}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
  caddy_data:
  caddy_config:

# Only the edge has a trusted, fixed address. API/database have no published ports.
# Operators must check subnet collisions before the approved infrastructure rollout.
networks:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${FLEET_FLOW_PROXY_SUBNET:-172.30.96.0/28}
